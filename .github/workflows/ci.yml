name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Quality (typecheck + lint) — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: AI timeout unit tests
        run: npm run test:ai-timeout
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      - name: Vision boxes unit tests
        run: npm run test:vision-boxes
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db

  test-e2e:
    name: Test E2E (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      GO2RTC_HOST: "127.0.0.1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # NOSONAR — ephemeral CI database only
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Generate ephemeral CI credentials
        run: | # NOSONAR — values are openssl-generated, no literals
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CAMERA_CREDENTIAL_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=ci-$(openssl rand -hex 8)" >> "$GITHUB_ENV"
          echo "OPERATOR_PASSWORD=ci-$(openssl rand -hex 8)" >> "$GITHUB_ENV"
          echo "VIEWER_PASSWORD=ci-$(openssl rand -hex 8)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Push DB schema
        run: npx drizzle-kit push
      - name: Seed default tenant
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "insert into tenants (id, slug, name) values (1, 'default', 'Default tenant') on conflict (id) do nothing;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "select setval(pg_get_serial_sequence('tenants','id'), greatest(1, (select coalesce(max(id),1) from tenants)));"
      - name: Build (Next.js)
        run: npm run build
      # H-01 tenant isolation: /api/alerts (5 đường) + /api/settings PATCH (platform-global config).
      # SKIP_BUILD=1 vì job này đã build ngay trên; mỗi suite tự spawn `next start` ở port riêng.
      - name: H-01 tenant isolation suites
        run: npm run test:h01
        env:
          SKIP_BUILD: "1"
      - name: Integration + unit tests
        run: npm run test:ai
        env:
          # T-1330: loopback fixture services must declare egress; undeclared
          # now fails safe to remote and trips the consent gate.
          HERMES_EGRESS: local
          DAI_VISION_EGRESS: local
          DAI_OCR_EGRESS: local
          DAI_VOICE_EGRESS: local
      - name: Egress consent + router foundation tests (T-1330)
        run: npm run test:t1330
      - name: Camera/product unit tests
        run: npm run test:camera
      - name: Google auth unit tests
        run: npm run test:google
      - name: Rate-limit + HTTP contract tests
        run: npm run test:rl-http
      - name: Camera health probe tests (T-1319)
        run: npm run test:t1319
      - name: Install ffmpeg (clip export runtime dep)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Playwright chromium (UI suites)
        run: ./node_modules/.bin/playwright install --with-deps chromium
      # Nối thêm các suite milestone/local còn thiếu vào cuối vòng lặp (seed, h01g/h,
      # P1-P4, M6, M7, responsive, cam-ui-001, p4 smoke). Tất cả đều tự spawn
      # `next start` trên port trống và tái sử dụng .next/BUILD_ID từ bước build.
      - name: Feature + milestone regression suites
        run: |
          for s in test:scope test:retention test:t1318 test:t1323 test:t1335 test:t1336 test:t1337 test:t1338 test:t1339 test:t1340 test:t1341 test:t1346 test:t1348 test:t1353 test:t1350 test:t1355 test:t1356 test:t1351 test:t1347 test:t1361 test:t1364 test:t1365 test:t1362 test:seed test:h01g test:h01h test:p1 test:p2 test:p3 test:p4 test:m6 test:m7 test:responsive test:cam-ui-001 test:p4:smoke; do
            echo "== $s =="
            npm run "$s" || exit 1
          done
        env:
          SKIP_BUILD: "1"

  security:
    name: Security scans (gitleaks + semgrep + trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks (secret detection, full history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep (p/security-audit, error severity)
        run: |
          pip install semgrep
          semgrep scan --config p/security-audit --severity ERROR --error || exit 1
      - name: Trivy filesystem (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: "CRITICAL,HIGH"
          exit-code: "1"
