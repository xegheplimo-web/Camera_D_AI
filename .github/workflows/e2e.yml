name: E2E Browser Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Playwright browser smoke (real Next server + Postgres)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      AUTH_SECRET: 2676c174d4069301370e3593c0eb8546ea1b05bb6e63c223e9b7261c07aa52d4b13a41c3f8e299878e419b97d11fc8ef
      ADMIN_PASSWORD: ci-owner-passw0rd
      OPERATOR_PASSWORD: ci-operator-passwd
      VIEWER_PASSWORD: ci-viewer-passwd
      CAMERA_CREDENTIAL_KEY: fe880598fd8d4cd9000b337f89d26ff2f796134037f14043848433adcf9a4ff4
      GO2RTC_HOST: "127.0.0.1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Push DB schema
        run: npx drizzle-kit push
      - name: Build (Next.js)
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start > server.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf -o /dev/null http://localhost:3000/login; then echo "server up"; break; fi
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:3000/login || (echo "server failed to start"; tail -50 server.log; exit 1)
      - name: Browser smoke (isolated operator login, responsive, chat gateway, memory, upload)
        run: npx tsx tests/browser-smoke.ts
      - name: Upload evidence on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-evidence
          path: |
            artifacts/screenshots/
            server.log
          if-no-files-found: ignore
